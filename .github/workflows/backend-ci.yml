name: Backend CI

on:
  push:
  pull_request:

# Least privilege: the test job only needs to read the repository. No write
# scopes, and no production secrets are referenced anywhere in this workflow,
# so CI cannot make a live (billable) Meta model call — MODEL_API_KEY is never
# set, which keeps every run on the non-chargeable path.
permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
